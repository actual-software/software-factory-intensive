# actual-reviewer — Code-Review agent for the Actual Software Factory.
#
# Takes beads labelled `needs-review` (handed off by the builder) and
# reviews for style, security, and spec compliance. Hands off to the
# release-gate on pass, back to the builder on fail.
#
# Persona anchor: engineering-manager + principal-engineer +
# security-engineer from
# actual-factory/extensions/factory-vscode/shared/actual-agents/built-in-agents.ts

[pack]
name = "actual-reviewer"
schema = 1

[[doctor]]
name = "check-reviewer"
script = "doctor/check-reviewer.sh"
description = "Verify reviewer prerequisites (bd, gc, git, gh, jq)"

[[commands]]
name = "status"
description = "Show reviewer work status for the current rig"
script = "commands/status.sh"

[[commands]]
name = "verdicts"
description = "List recent review verdicts"
script = "commands/verdicts.sh"

[formulas]
dir = "formulas"

[[agent]]
name = "reviewer"
scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/agents/{{.Rig}}/reviewer"
prompt_template = "prompts/reviewer.md.tmpl"
nudge = "Check your hook for work and act on it."
overlay_dir = "overlays/default"
idle_timeout = "2h"
min_active_sessions = 0
max_active_sessions = 1
work_query = "gc bd --rig l4-project list --label=needs-review --status=open --json 2>/dev/null"

[[named_session]]
template = "reviewer"
scope = "rig"
mode = "on_demand"
