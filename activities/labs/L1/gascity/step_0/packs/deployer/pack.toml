[pack]
name = "deployer"
schema = 1
description = "Deployer agent — release gate evaluation and deployment prep"

[formulas]
dir = "formulas"

[[agent]]
name = "deployer"
scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/agents/{{.Rig}}/deployer"
prompt_template = "prompts/deployer.md"
overlay_dir = "overlays/default"
nudge = "Check your hook for reviewed code ready for release evaluation."
idle_timeout = "1h"
min_active_sessions = 0
max_active_sessions = 1
work_query = "gc bd --rig l1-project list --label=needs-deploy --status=open --json 2>/dev/null"

[[named_session]]
template = "deployer"
scope = "rig"
mode = "on_demand"
