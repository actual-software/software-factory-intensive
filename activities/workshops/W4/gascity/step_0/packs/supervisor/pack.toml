# actual-supervisor — City-level coordination and rig-level health monitoring.
#
# Ports the gastown deacon/witness pattern to the Actual Software Factory.
# Deacon: routes labelled beads to the correct pipeline agent via gc sling.
# Witness: recovers orphaned in_progress beads that agents dropped.

[pack]
name = "actual-supervisor"
schema = 1

[formulas]
dir = "formulas"

# ── DEACON — City-wide routing coordinator. Singleton. ──────────────────
[[agent]]
name = "deacon"
scope = "city"
wake_mode = "fresh"
work_dir = ".gc/agents/deacon"
prompt_template = "prompts/deacon.md.tmpl"
nudge = "Run gc prime to dispatch labelled beads and check factory health."
idle_timeout = "2h"

[[named_session]]
template = "deacon"
scope = "city"
mode = "always"

# ── WITNESS — Per-rig work-health monitor. Singleton. ───────────────────
[[agent]]
name = "witness"
scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/agents/{{.Rig}}/witness"
prompt_template = "prompts/witness.md.tmpl"
nudge = "Run gc prime to check rig work health and recover orphaned beads."
idle_timeout = "2h"

[[named_session]]
template = "witness"
scope = "rig"
mode = "always"
