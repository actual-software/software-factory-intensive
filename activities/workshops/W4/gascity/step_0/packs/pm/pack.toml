# actual-pm — Plan / Work-Breakdown agent for the Actual Software Factory.
#
# Takes goal-shaped beads (labelled needs-pm) and produces a
# dependency-ordered graph of concrete task beads that the builder
# can consume.
#
# Ships two skills in its overlay:
#   1. `actual`       — vendored from actual-software/actual-skill, so the
#                       pm can keep CLAUDE.md/AGENTS.md in the loop.
#   2. `tracker-to-beads` — pack-local; probes for sibling tracker skills
#                       (jira, linear, github-issues, tracker-*) and
#                       materializes external issues as `bd` beads.
#
# Persona anchor: product-manager + program-manager from
# actual-factory/extensions/factory-vscode/shared/actual-agents/built-in-agents.ts

[pack]
name = "actual-pm"
schema = 1

[[doctor]]
name = "check-pm"
script = "doctor/check-pm.sh"
description = "Verify pm prerequisites (bd, gc, jq)"

[[commands]]
name = "status"
description = "Show pm work status for the current rig"
script = "commands/status.sh"

[[commands]]
name = "plan"
description = "Print the current work-breakdown graph for a goal bead"
script = "commands/plan.sh"

[[commands]]
name = "tracker-sync"
description = "Manually run the tracker → beads import"
script = "commands/tracker-sync.sh"

[formulas]
dir = "formulas"

# ── PM — PM voice + program-management discipline. ──────────────
[[agent]]
name = "pm"
scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/agents/{{.Rig}}/pm"
prompt_template = "prompts/pm.md.tmpl"
nudge = "Check your hook for work and act on it."
overlay_dir = "overlays/default"
idle_timeout = "2h"
min_active_sessions = 0
max_active_sessions = 1
work_query = "gc bd --rig w4-project list --label=needs-pm --status=open --json 2>/dev/null"

[[named_session]]
template = "pm"
scope = "rig"
mode = "on_demand"
