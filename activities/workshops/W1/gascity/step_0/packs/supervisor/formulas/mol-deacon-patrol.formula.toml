description = "Deacon patrol: route labelled beads, check health, loop."
formula = "mol-deacon-patrol"
version = 1

[[steps]]
id = "route-needs-plan"
title = "Dispatch needs-plan beads to planner"
description = """
Find all open beads with label needs-plan that have no assignee:
  gc bd --rig "$RIG" list --label=needs-plan --status=open --no-assignee --json
For each bead, sling to the planner then assign it to prevent re-dispatch:
  gc sling "$RIG/planner" "Pick up bead <id>: <title>"
  gc bd --rig "$RIG" update <id> --assignee="$RIG/planner"
Log how many were dispatched.
"""

