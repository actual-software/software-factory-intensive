[order]
description = "Wake the builder when any bead is labelled ready-to-build"
formula = "mol-tdd-build"
gate = "condition"
check = "[ -n \"$GC_RIG\" ] && gc bd --rig \"$GC_RIG\" list --label=ready-to-build --status=open --no-assignee --json 2>/dev/null | jq -e 'length > 0' > /dev/null 2>&1"
pool = "builder"
