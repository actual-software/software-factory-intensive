[order]
description = "Wake the designer when any bead is labelled needs-design"
formula = "mol-design-cycle"
gate = "condition"
check = "[ -n \"$GC_RIG\" ] && gc bd --rig \"$GC_RIG\" list --label=needs-design --status=open --no-assignee --json 2>/dev/null | jq -e 'length > 0' > /dev/null 2>&1"
pool = "designer"
