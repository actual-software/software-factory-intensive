[order]
description = "Wake the planner when any bead is labelled needs-plan"
formula = "mol-planner-prd"
gate = "condition"
check = "[ -n \"$GC_RIG\" ] && gc bd --rig \"$GC_RIG\" list --label=needs-plan --status=open --no-assignee --json 2>/dev/null | jq -e 'length > 0' > /dev/null 2>&1"
pool = "planner"
