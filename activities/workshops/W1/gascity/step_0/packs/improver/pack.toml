# actual-improver — Feedback-Loop agent for the Actual Software
# Factory.
#
# Harvests runtime signals (metrics, errors, user feedback) after a
# release and feeds them back into the factory as new beads for the
# right upstream agent — architect, pm, designer, validator,
# builder, or reviewer.
#
# Wakes on a cooldown schedule (daily) rather than a label condition,
# because the feedback loop needs to run periodically regardless of
# whether new `needs-improve` work exists.
#
# Persona anchor: sre + performance-engineer + developer-advocate
# from
# actual-factory/extensions/factory-vscode/shared/actual-agents/built-in-agents.ts

[pack]
name = "actual-improver"
schema = 1

[[doctor]]
name = "check-improver"
script = "doctor/check-improver.sh"
description = "Verify improver prerequisites (bd, gc, jq)"

[[commands]]
name = "status"
description = "Show improver work status"
script = "commands/status.sh"

[[commands]]
name = "harvest"
description = "Manually trigger a feedback-harvest cycle"
script = "commands/harvest.sh"

[formulas]
dir = "formulas"

[[agent]]
name = "improver"
scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/agents/{{.Rig}}/improver"
prompt_template = "prompts/improver.md.tmpl"
nudge = "Check your hook for work and act on it."
overlay_dir = "overlays/default"
idle_timeout = "2h"
min_active_sessions = 0
max_active_sessions = 1
