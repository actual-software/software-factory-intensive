# actual-validator — Test / Acceptance-Criteria agent for the Actual
# Software Factory.
#
# Takes beads labelled `needs-tests` and produces automated test
# suites that encode the acceptance criteria the builder must satisfy.
#
# Persona anchor: qa-engineer from
# actual-factory/extensions/factory-vscode/shared/actual-agents/built-in-agents.ts

[pack]
name = "actual-validator"
schema = 1

[[doctor]]
name = "check-validator"
script = "doctor/check-validator.sh"
description = "Verify validator prerequisites (bd, gc, jq)"

[[commands]]
name = "status"
description = "Show validator work status for the current rig"
script = "commands/status.sh"

[[commands]]
name = "tests"
description = "List test files that came from actual-validator"
script = "commands/tests.sh"

[formulas]
dir = "formulas"

[[agent]]
name = "validator"
scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/agents/{{.Rig}}/validator"
prompt_template = "prompts/validator.md.tmpl"
nudge = "Check your hook for work and act on it."
overlay_dir = "overlays/default"
idle_timeout = "2h"
min_active_sessions = 0
max_active_sessions = 1
work_query = "gc bd --rig w1-project list --label=needs-tests --status=open --json 2>/dev/null"

[[named_session]]
template = "validator"
scope = "rig"
mode = "on_demand"
