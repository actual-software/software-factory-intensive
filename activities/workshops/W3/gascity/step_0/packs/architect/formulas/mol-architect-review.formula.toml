description = """
Architect review — 6 steps from intake through handoff.

Turn a `needs-architecture` bead into a system design document,
ADRs, rules, and downstream work beads. Uses the bundled `actual`
skill to keep ADRs in sync with generated CLAUDE.md/AGENTS.md files.

## Contract

1. Caller slings with a bead id (passed implicitly via `bd mol current`).
2. Architect reads steps, executes each in order.
3. On completion, child beads labelled `needs-plan` exist for the pm.

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| topic | caller | Short topic slug for design doc and rules file (e.g., "auth-boundaries") |
| skip_adr_sync | caller | "true" to skip the actual-adr-sync step (default: "false") |

## Failure modes

| Situation | Action |
|-----------|--------|
| `actual` binary missing | Log to bead notes, skip adr-sync step, continue |
| ADR dry-run diff is non-trivial | File divergence bead, STOP, mail user |
| Rig git tree is dirty | Skip adr-sync commit, write to bead notes, continue |
"""
formula = "mol-architect-review"
version = 1

[vars]
[vars.topic]
description = "Short topic slug used to name the design doc and rules file under docs/"
required = true

[vars.skip_adr_sync]
description = "Set to 'true' to skip the actual-adr-sync step (useful in rigs without the actual CLI installed)"
default = "false"

[[steps]]
id = "intake"
title = "Read the bead and identify the architectural question"
description = """
Identify what this architecture task is really asking.

**1. Find the root bead:**
```bash
ROOT_ID=$(bd mol current --json | jq -r '.molecule_id')
```

**2. Read its title, body, and notes:**
```bash
bd show $ROOT_ID
```

**3. Classify the question.** Pick one of: access-control,
trust-boundary, data-flow, integration-topology, performance-budget,
operational-constraint, other. Record in bead notes:
```bash
bd update $ROOT_ID --notes "arch_category: <category>
topic: {{topic}}"
```

**Exit criteria:** Category and topic recorded in root bead notes.
"""

[[steps]]
id = "research"
title = "Survey existing code, tech stack, ADRs, and constraints"
needs = ["intake"]
description = """
Understand the current state before proposing anything.

**1. List existing ADRs and rules:**
```bash
find docs/adr docs/rules docs/architecture architecture/decisions -type f \\
    -name '*.md' 2>/dev/null || true
```

**2. Read the current CLAUDE.md / AGENTS.md if present:**
```bash
ls CLAUDE.md AGENTS.md 2>/dev/null
```

**3. Survey the existing tech stack.** Check package.json, go.mod,
Cargo.toml, requirements.txt, etc. Identify frameworks, libraries,
and database choices already in use.

**4. Grep the codebase for relevant patterns.** For an access-control
topic, look for auth middleware; for a data-flow topic, look for the
primary persistence layer; and so on.

**5. Write a 1-paragraph findings summary to the bead notes:**
```bash
bd update $ROOT_ID --notes "<existing notes>
assessment: <1-paragraph summary>"
```

**Exit criteria:** Findings recorded. You know what's already in place.
"""

[[steps]]
id = "design"
title = "Write the system design document"
needs = ["research"]
description = """
Produce the comprehensive system design covering technology choices,
schema, APIs, and component architecture.

**1. Write `docs/architecture/{{topic}}.md`:**

Structure:
```markdown
# System Design: {{topic}}

Root: $ROOT_ID
Generated: <YYYY-MM-DD>

## Overview

<1-2 paragraph summary of the system being designed>

## Technology Stack

| Layer | Choice | Rationale |
|-------|--------|-----------|
| Language/Runtime | ... | ... |
| Framework | ... | ... |
| Database | ... | ... |
| Auth | ... | ... |
| Deployment | ... | ... |

## Database Schema

<Tables, relationships, indexes. ERD in ASCII or Mermaid.>

## API Design

<Key endpoints/routes, request/response shapes.>

## Component Architecture

<Directory layout, module boundaries, data flow.>

## Trade-offs & Alternatives Considered

<What was rejected and why.>
```

**2. Stage and commit (if git tree was clean):**
```bash
mkdir -p docs/architecture
git add docs/architecture/{{topic}}.md
git commit -m "actual-architect: system design for {{topic}} (refs $ROOT_ID)"
```

**Exit criteria:** Design document written to `docs/architecture/{{topic}}.md`.
"""

[[steps]]
id = "actual-adr-sync"
title = "Sync ADRs to CLAUDE.md/AGENTS.md via the actual skill"
needs = ["design"]
description = """
Run `actual adr-bot` to sync the rig's CLAUDE.md/AGENTS.md with its
ADRs. Uses `--no-tailor` to avoid spawning an AI subprocess inside
the agent session (the default `claude-cli` runner hangs when called
from within a Claude Code session). **DO NOT skip this step because
you think it needs an interactive terminal — it does NOT when
`--force --no-tui` are passed. You MUST actually run the command.**

**Skip this step ONLY if `{{skip_adr_sync}}` is "true".**

**1. Change to the rig root** (where CLAUDE.md and .actual/ live)
and check the `actual` binary is available:
```bash
cd "$RIG_ROOT"   # Set from the Rig root shown in your prompt footer
if ! command -v actual >/dev/null 2>&1; then
    bd update $ROOT_ID --notes "<existing notes>
adr_sync: skipped — actual CLI not installed"
    # Close this step and proceed.
    exit 0
fi
```

**2. Check the git tree is clean.** If it's dirty, we must not commit
anything — skip and report:
```bash
if [ -n "$(git status --porcelain)" ]; then
    bd update $ROOT_ID --notes "<existing notes>
adr_sync: skipped — dirty worktree"
    exit 0
fi
```

**3. Dry-run:**
```bash
actual adr-bot --dry-run --full --force --no-tui --no-tailor
```
Read the diff carefully. Is it small and sensible (e.g., one added
rule matching the current topic)? Or is it a large divergence from an
unrelated ADR drift?

**4a. Small, sensible diff → commit it:**
```bash
actual adr-bot --force --no-tui --no-tailor
actual status
git add CLAUDE.md AGENTS.md docs/adr docs/rules
git commit -m "actual-architect: sync ADRs for {{topic}}"
```

**4b. Large divergence → file a divergence bead and STOP:**
```bash
DIVERGENCE_ID=$(bd create \\
    --title "ADR divergence: {{topic}}" \\
    --label source:actual-architect \\
    --label type:divergence \\
    --notes "Dry-run diff was non-trivial. Review manually." \\
    --json | jq -r '.id')
bd dep add $ROOT_ID --blocked-by $DIVERGENCE_ID
```
Record `adr_sync: divergence_filed` in the root bead notes.

**Exit criteria:** Either ADRs committed, sync skipped with a
documented reason, or a divergence bead filed.
"""

[[steps]]
id = "rules"
title = "Write the architectural rule"
needs = ["actual-adr-sync"]
description = """
Codify the architectural decision as a one-page rule file.

**1. Write `docs/rules/{{topic}}.md`:**

Structure:
```markdown
# {{topic}}

**Status:** active
**Owner:** architect
**Date:** <YYYY-MM-DD>

## Rule

<1-3 sentences stating the rule.>

## Why

<Why this rule exists. Link to the bead that motivated it, and to
any related ADRs.>

## How to apply

<Concrete guidance for the builder, reviewer, and release-gate agents
on how to enforce or verify the rule.>

## Exceptions

<Cases where the rule does not apply, if any.>
```

**2. Stage and commit (if git tree was clean at assessment time):**
```bash
mkdir -p docs/rules
git add docs/rules/{{topic}}.md
git commit -m "actual-architect: add rule for {{topic}} (refs $ROOT_ID)"
```

**Exit criteria:** Rule file written to `docs/rules/{{topic}}.md`.
"""

[[steps]]
id = "handoff"
title = "Create downstream work beads and hand off to pm"
needs = ["rules"]
description = """
Convert the architectural decision into concrete next-action beads
for the pm.

**1. For each implication of the new rule, create a child bead:**
```bash
CHILD_ID=$(bd create \\
    --title "<concrete implication>" \\
    --label needs-plan \\
    --label source:actual-architect \\
    --notes "Derived from {{topic}} architecture. See docs/architecture/{{topic}}.md and docs/rules/{{topic}}.md" \\
    --json | jq -r '.id')
bd dep add $CHILD_ID --blocked-by $ROOT_ID
```

**2. Close the root bead:**
```bash
bd close $ROOT_ID --reason "architecture complete, see docs/architecture/{{topic}}.md"
```

**3. The pm picks up work automatically:**
```bash
# Mail the pm so it wakes and picks up the needs-plan beads.
gc mail send pm "Handoff: rule {{topic}} published, child beads labelled needs-plan"
```

**Exit criteria:** Root bead closed, at least one child bead created
with `needs-plan` label.
"""
