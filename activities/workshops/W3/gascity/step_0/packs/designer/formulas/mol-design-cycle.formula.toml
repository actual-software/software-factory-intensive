description = """
Design cycle — 4 steps from a `needs-design` bead to a wireframe
handed off to the builder.

## Contract

1. Caller slings with a root bead labelled `needs-design`.
2. Designer produces a wireframe + a11y audit in
   `docs/designs/<slug>.md`.
3. Bead gets relabelled `needs-pm` with `source:actual-designer` and
   the pm decomposes it into implementation tasks.

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| slug | caller | Short slug for the design artifact filename |
"""
formula = "mol-design-cycle"
version = 1

[vars]
[vars.slug]
description = "Short slug for the design artifact under docs/designs/"
required = true

[vars.skip_adr_sync]
description = "Set to 'true' to skip the actual-adr-sync step (useful in rigs without the actual CLI installed)"
default = "false"

[[steps]]
id = "intake"
title = "Read the bead and map the user journey"
description = """
**1. Root bead + parent plan:**
```bash
ROOT_ID=$(bd mol current --json | jq -r '.molecule_id')
bd show $ROOT_ID
PLAN_SLUG=$(bd show $ROOT_ID --json | jq -r '.labels[] | select(startswith("plan:")) | sub("plan:";"")')
[ -n "$PLAN_SLUG" ] && [ -f "docs/plans/$PLAN_SLUG.md" ] && cat "docs/plans/$PLAN_SLUG.md"
```

**2. Survey existing components** — grep for existing storybook
entries, component files, or design tokens. Re-use aggressively.

**Exit criteria:** You can name the primary user action and every
screen or component it touches.
"""

[[steps]]
id = "wireframe"
title = "Write the wireframe and interaction spec"
needs = ["intake"]
description = """
Draft `docs/designs/{{slug}}.md` with:

```markdown
# Design: {{slug}}

Root: $ROOT_ID
Generated: <YYYY-MM-DD>

## User journey

1. <step 1>
2. <step 2>

## Screens

### Screen 1: <name>

```
+--------------------+
| Header             |
+--------------------+
| ... ASCII sketch . |
+--------------------+
```

Components reused: <list from the design system>
New components needed: <list, or "none">

## Interactions

| Event | Target | Result |
|-------|--------|--------|
| ... | ... | ... |
```

Commit the file if the worktree was otherwise clean.

**Exit criteria:** Wireframe file exists and is committed (or noted
as uncommitted due to dirty tree).
"""

[[steps]]
id = "a11y-check"
title = "Walk the design and record accessibility notes"
needs = ["wireframe"]
description = """
Add an accessibility section to the same design file:

```markdown
## Accessibility (WCAG 2.1 AA)

- **Focus order:** <describe or reference heading hierarchy>
- **ARIA roles:** <list>
- **Keyboard navigation:** <what shortcuts, what gets focus>
- **Color contrast:** <note any colors that need contrast checks>
- **Screen-reader labels:** <list of labels, alt text, aria-labels>
- **Risks:** <any known a11y gaps the builder must avoid>
```

Never ship a design without this section.

**Exit criteria:** A11y section exists in the design file.
"""

[[steps]]
id = "actual-adr-sync"
title = "Sync ADRs to CLAUDE.md/AGENTS.md via the actual skill"
needs = ["a11y-check"]
description = """
Run `actual adr-bot` to sync the rig's CLAUDE.md/AGENTS.md with its
ADRs after design work. Uses `--no-tailor` to avoid spawning an AI
subprocess inside the agent session. **DO NOT skip this step because
you think it needs an interactive terminal — it does NOT when
`--force --no-tui` are passed. You MUST actually run the command.**

**Skip this step ONLY if `{{skip_adr_sync}}` is "true".**

**1. Change to the rig root and check the `actual` binary:**
```bash
cd "$RIG_ROOT"
if ! command -v actual >/dev/null 2>&1; then
    bd update $ROOT_ID --notes "<existing notes>
adr_sync: skipped — actual CLI not installed"
    exit 0
fi
```

**2. Check the git tree is clean:**
```bash
if [ -n "$(git status --porcelain)" ]; then
    bd update $ROOT_ID --notes "<existing notes>
adr_sync: skipped — dirty worktree"
    exit 0
fi
```

**3. Dry-run:**
```bash
actual adr-bot --dry-run --full --force --no-tui --no-tailor
```
Read the diff carefully. Is it small and sensible? Or is it a large
divergence from an unrelated ADR drift?

**4a. Small, sensible diff → commit it:**
```bash
actual adr-bot --force --no-tui --no-tailor
actual status
git add CLAUDE.md AGENTS.md
git commit -m "actual-designer: sync ADRs after design cycle"
```

**4b. Large divergence → file a divergence bead and STOP:**
```bash
DIVERGENCE_ID=$(bd create \\
    --title "ADR divergence: design cycle" \\
    --label source:actual-designer \\
    --label type:divergence \\
    --notes "Dry-run diff was non-trivial. Review manually." \\
    --json | jq -r '.id')
bd dep add $ROOT_ID --blocked-by $DIVERGENCE_ID
```
Record `adr_sync: divergence_filed` in the root bead notes.

**Exit criteria:** Either ADRs committed, sync skipped with a
documented reason, or a divergence bead filed.
"""

[[steps]]
id = "handoff"
title = "Relabel bead and hand off to pm"
needs = ["actual-adr-sync"]
description = """
```bash
bd update $ROOT_ID \\
    --add-label needs-pm \\
    --add-label source:actual-designer \\
    --remove-label needs-design \\
    --notes "<existing notes>
design_artifact: docs/designs/{{slug}}.md"

# Mail the pm so it wakes and decomposes the completed design.
gc mail send pm "Handoff: $ROOT_ID design complete at docs/designs/{{slug}}.md"
```

**Exit criteria:** Bead relabelled `needs-pm`; pm picks up work via intake order.
"""
