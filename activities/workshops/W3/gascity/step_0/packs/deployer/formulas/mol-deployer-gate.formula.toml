name = "mol-deployer-gate"
description = "Evaluate release gate for reviewed features and produce a gate checklist."

[[steps]]
id = "find-work"
description = "Find needs-deploy bead assigned to this session"
prompt = """
Find your assigned bead:
  bd list --label=needs-deploy --status=in_progress --assignee="$GC_ALIAS" --json

If none found, check for unassigned needs-deploy beads:
  bd list --label=needs-deploy --status=open --json

Claim the first available bead:
  bd update <id> --claim
  bd update <id> --status=in_progress

Note the bead ID and title for the next steps.
"""

[[steps]]
id = "evaluate-gate"
description = "Run release gate evaluation against review report and acceptance criteria"
prompt = """
For the bead claimed in the previous step, locate:
  - Review report: review-reports/<feature-slug>-review.md
  - Work package: work-packages/<feature-slug>.md
  - Release criteria: docs/PROJECT_MANIFEST.md (Release Criteria section)

Evaluate each release criterion with binary PASS/FAIL and evidence.

Write the gate checklist to release-gates/<feature-slug>-gate.md in this format:
  # Release Gate: <Feature Name>
  ## Overall Verdict
  PASS / FAIL
  ## Criteria
  | # | Criterion | Result | Evidence |
  |---|-----------|--------|----------|
  | 1 | All acceptance criteria met | PASS/FAIL | ... |

If PASS: label the bead ready-to-deploy and close it.
If FAIL: label the bead needs-review (send back for revision) and add a note explaining what failed.
"""

[[steps]]
id = "complete"
description = "Close the bead and report outcome"
prompt = """
Report the gate outcome:
  - Feature slug
  - Overall verdict (PASS/FAIL)
  - Gate checklist location

If verdict is PASS:
  bd update <id> --label=ready-to-deploy
  bd close <id>

If verdict is FAIL:
  bd update <id> --label=needs-review
  bd update <id> --status=open --assignee=""
  Add a note: bd update <id> --notes="Gate failed: <summary of failures>"
"""
