name = "mol-witness-patrol"
description = "Witness patrol: recover orphaned beads, report queue health, loop."

[[steps]]
id = "find-orphans"
description = "Identify in_progress beads assigned to inactive agents"
prompt = """
Get all in_progress beads:
  bd list --status=in_progress --json

Get active session aliases:
  gc session list --json

Cross-reference: any bead whose assignee does not appear in active sessions
is orphaned. List the orphaned bead IDs and their stale assignees.
"""

[[steps]]
id = "recover-orphans"
description = "Reset orphaned beads to open"
prompt = """
For each orphaned bead found in the previous step:
  bd update <id> --status=open --assignee=""
  echo "Recovered bead <id> (was: <stale-assignee>)"

If no orphans, log "No orphaned beads found."
"""

[[steps]]
id = "queue-health"
description = "Report pipeline queue depth by label"
prompt = """
For each pipeline label, count open beads:
  bd list --label=needs-plan --status=open --json | jq 'length'
  bd list --label=needs-architecture --status=open --json | jq 'length'
  bd list --label=needs-pm --status=open --json | jq 'length'
  bd list --label=needs-design --status=open --json | jq 'length'
  bd list --label=needs-tests --status=open --json | jq 'length'
  bd list --label=ready-to-build --status=open --json | jq 'length'
  bd list --label=needs-review --status=open --json | jq 'length'

Report the counts. Flag any label with > 3 queued beads as a potential bottleneck.
"""

[[steps]]
id = "loop"
description = "Pour next patrol iteration"
prompt = """
Patrol complete. Log a summary of orphans recovered and queue depth.
Pour next patrol iteration:
  bd mol pour mol-witness-patrol
Then sleep — do not spin immediately.
"""
