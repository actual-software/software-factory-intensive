description = """
Plan breakdown — 6 steps from goal bead to a labelled dependency
graph of child beads.

## Contract

1. Caller slings with a root bead labelled `needs-plan`.
2. PM pulls in any tracker issues (no-op if none).
3. PM clarifies acceptance criteria, decomposes the goal,
   wires dependencies, labels children for downstream agents.
4. On completion, child beads with `needs-design`, `needs-tests`, or
   `ready-to-build` exist.

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| slug | caller | Short slug for the plan artifact filename |
| skip_tracker_import | caller | "true" to skip tracker-import step (default: "false") |
| max_children | caller | Rough upper bound on child count (default: "10") |
"""
formula = "mol-plan-breakdown"
version = 1

[vars]
[vars.slug]
description = "Short slug for the plan artifact; e.g., 'user-profiles'"
required = true

[vars.skip_tracker_import]
description = "Set to 'true' to skip the tracker-to-beads import step"
default = "false"

[vars.max_children]
description = "Soft upper bound on child-bead count. Larger plans get split."
default = "10"

[[steps]]
id = "intake"
title = "Read the goal bead"
description = """
**1. Root bead:**
```bash
ROOT_ID=$(bd mol current --json | jq -r '.molecule_id')
bd show $ROOT_ID
```

**2. Classify the goal** (feature / bug / refactor / research) and
record in notes:
```bash
bd update $ROOT_ID --notes "goal_class: <feature|bug|refactor|research>
slug: {{slug}}"
```

**Exit criteria:** Goal class recorded.
"""

[[steps]]
id = "tracker-import"
title = "Import issues from external trackers (skip-safe)"
needs = ["intake"]
description = """
Convert any external tracker issues to beads so the builder can
consume them uniformly.

**Skip entirely if `{{skip_tracker_import}}` is "true".**

**1. Invoke the pack-local skill:**
```bash
IMPORT_SCRIPT="$HOME/.claude/skills/tracker-to-beads/scripts/import.sh"
if [ ! -x "$IMPORT_SCRIPT" ]; then
    # Try the overlay-relative path (when running inside an agent)
    IMPORT_SCRIPT=".claude/skills/tracker-to-beads/scripts/import.sh"
fi

if [ -x "$IMPORT_SCRIPT" ]; then
    "$IMPORT_SCRIPT"
else
    echo "[tracker-import] tracker-to-beads skill not found — skipping"
fi
```

**2. Record the result in the root bead notes:**
```bash
if [ -f .actual/pm/tracker-sync.json ]; then
    COUNT=$(jq '.mappings | length' .actual/pm/tracker-sync.json)
    bd update $ROOT_ID --notes "<existing notes>
tracker_sync: ok ($COUNT issues mapped)"
else
    bd update $ROOT_ID --notes "<existing notes>
tracker_sync: none"
fi
```

**Exit criteria:** Either a fresh/unchanged tracker-sync.json exists,
or the step no-oped. Never fail the formula for tracker reasons.
"""

[[steps]]
id = "clarify"
title = "Clarify acceptance criteria"
needs = ["tracker-import"]
description = """
A goal without measurable acceptance criteria is unplannable. Before
decomposing, make sure you can tell when the work is done.

**1. Read the root bead body + notes.** Look for a section labelled
"Acceptance" or "Done when".

**2. If missing, write draft criteria** based on the goal. Example:
```
Acceptance criteria:
1. <observable outcome 1>
2. <observable outcome 2>
3. <measurable quality bar, e.g., "<200ms p95 latency">
```

**3. If the goal is ambiguous enough that you can't write draft
criteria confidently, STOP and file a clarification bead:**
```bash
CLARIFY_ID=$(bd create \\
    --title "Clarify: $(bd show $ROOT_ID --json | jq -r .title)" \\
    --label needs-info \\
    --notes "PM cannot proceed without: <specific questions>" \\
    --json | jq -r '.id')
bd dep add $ROOT_ID --blocked-by $CLARIFY_ID
gc mail send mayor "PM blocked: $ROOT_ID needs clarification"
exit 0
```

**4. Otherwise, record criteria in the root bead notes:**
```bash
bd update $ROOT_ID --notes "<existing notes>
acceptance:
<criteria text>"
```

**Exit criteria:** Acceptance criteria exist in the root bead notes,
OR a clarification bead is filed and the formula pauses.
"""

[[steps]]
id = "decompose"
title = "Break the goal into concrete child beads"
needs = ["clarify"]
description = """
Create 3-{{max_children}} child beads. Each must be one unit of work
that a single downstream agent can complete.

**For each child:**
```bash
CHILD_ID=$(bd create \\
    --title "<concrete user-story title>" \\
    --label <needs-design|needs-tests|ready-to-build> \\
    --label source:actual-pm \\
    --label plan:{{slug}} \\
    --notes "Acceptance:
- <criterion 1>
- <criterion 2>

Derived from $ROOT_ID" \\
    --json | jq -r '.id')
```

**Label routing rules:**
- **Design-touching work** (new screens, new flows, changed
  interactions) → `needs-design`
- **Pure validation work** (new test coverage for existing code,
  acceptance test suites) → `needs-tests`
- **Pure implementation** (backend endpoint, algorithm, refactor) →
  `ready-to-build`
- **Cross-cutting work** → create multiple children with different
  labels and wire dependencies

**Track child IDs** in a shell array so the next step can wire them:
```bash
CHILDREN=("$CHILD_1" "$CHILD_2" ...)
```

**Exit criteria:** Between 1 and {{max_children}} children created,
each with a routing label and acceptance notes.
"""

[[steps]]
id = "dep-graph"
title = "Wire dependencies between children"
needs = ["decompose"]
description = """
Most plans have an implicit order: design before build, tests before
or alongside build, etc. Encode it with `bd dep add`.

**1. For each dependency edge:**
```bash
bd dep add <child-id> --blocked-by <prerequisite-id>
```

**2. Verify the graph is a DAG** (no cycles):
```bash
bd dep graph $ROOT_ID --format=ascii
```

**3. Record the edges in the plan artifact:**
```bash
mkdir -p docs/plans
cat > docs/plans/{{slug}}.md <<EOF
# Plan: {{slug}}

Root: $ROOT_ID
Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)

## Children

$(bd list --label plan:{{slug}} --format=markdown)

## Dependency graph

```
$(bd dep graph $ROOT_ID --format=ascii)
```
EOF
```

**Exit criteria:** Plan file exists. Dep graph is acyclic.
"""

[[steps]]
id = "handoff"
title = "Close the root bead and notify downstream"
needs = ["dep-graph"]
description = """
**1. Commit the plan artifact if the worktree was clean:**
```bash
if [ -z "$(git status --porcelain docs/plans)" ]; then
    : # already clean — nothing to do
else
    git add docs/plans/{{slug}}.md .actual/pm/tracker-sync.json 2>/dev/null || true
    git commit -m "actual-pm: plan for {{slug}} (refs $ROOT_ID)"
fi
```

**2. Close the root bead:**
```bash
bd close $ROOT_ID --reason "plan complete: docs/plans/{{slug}}.md"
```

**3. Downstream agents pick up work automatically via labels:**
```bash
# The labels trigger the corresponding intake orders automatically:
# Mail downstream agents that received work:
if bd list --label needs-design --label plan:{{slug}} --limit=1 | grep -q .; then
    gc mail send designer "Handoff: {{slug}} has design work"
fi
if bd list --label needs-tests --label plan:{{slug}} --limit=1 | grep -q .; then
    gc mail send validator "Handoff: {{slug}} has test work"
fi
if bd list --label ready-to-build --label plan:{{slug}} --limit=1 | grep -q .; then
    gc mail send builder "Handoff: {{slug}} has build work"
fi
```

**Exit criteria:** Root bead closed; plan file committed (if
possible); downstream agents pick up labelled work via intake orders.
"""
