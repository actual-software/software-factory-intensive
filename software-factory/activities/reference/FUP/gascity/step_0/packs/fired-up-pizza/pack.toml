# Fired Up Pizza — composite pack bundling the 6 factory agents.
#
# Each agent is its own pack so participants can adopt them
# incrementally during the workshop labs. This composite includes
# all of them for running the full factory against the reference
# project.
#
# Role → shipped pack mapping:
#   Planner   → ../planner
#   Architect → ../architect
#   Designer  → ../designer
#   Coder     → ../coder
#   Reviewer  → ../reviewer
#   Deployer  → ../deployer

[pack]
name = "fired-up-pizza"
schema = 1
description = "6-agent software factory — all agents bundled for the Fired Up Pizza reference project"
includes = [
    "../planner",
    "../architect",
    "../designer",
    "../coder",
    "../reviewer",
    "../deployer",
]

[formulas]
dir = "formulas"

[[doctor]]
name = "check-project"
script = "doctor/check-project.sh"
description = "Verify reference project scaffold is ready"
