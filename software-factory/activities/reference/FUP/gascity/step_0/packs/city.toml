# Fired Up Pizza — 6-agent reference factory workspace.
#
# Brings up the composite `fired-up-pizza` pack against the FUP
# reference project. Installed via:
#   python3 software-factory/scripts/curriculum_agent.py install FUP

[workspace]
name = "fup-gc-factory"
provider = "claude"
start_command = "~/.nvm/versions/node/v22.19.0/bin/claude"
includes = ["packs/actual/all"]

[providers.claude]
option_defaults = { model = "sonnet" }

[session]
startup_timeout = "3m"

[daemon]
patrol_interval = "30s"
max_restarts = 5
restart_window = "1h"
shutdown_timeout = "5s"
