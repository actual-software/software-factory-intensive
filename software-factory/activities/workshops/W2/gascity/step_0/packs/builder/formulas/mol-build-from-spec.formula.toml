description = """
Build from spec — 6 steps from a `ready-to-build` bead to a committed
code change handed off to the reviewer.

## Contract

1. Caller slings with a root bead labelled `ready-to-build`.
2. Builder verifies ADRs are in sync via the actual skill.
3. Builder implements against the bead's acceptance criteria.
4. Builder runs tests, commits, hands off to reviewer.

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| test_cmd | caller | Command to run tests (default: inferred from rig) |
| commit_scope | caller | Scope for the conventional commit (default: "feat") |
"""
formula = "mol-build-from-spec"
version = 1

[vars]
[vars.test_cmd]
description = "Command to run the validator's test suite. Empty means auto-detect."
default = ""

[vars.commit_scope]
description = "Conventional-commit type (feat|fix|refactor|...)"
default = "feat"

[[steps]]
id = "intake"
title = "Read the bead, plan artifact, and architectural rules"
description = """
**1. Root bead:**
```bash
ROOT_ID=$(bd mol current --json | jq -r '.molecule_id')
bd show $ROOT_ID
```

**2. Pull the plan artifact** if the bead carries a `plan:*` label:
```bash
PLAN_SLUG=$(bd show $ROOT_ID --json | jq -r '.labels[] | select(startswith("plan:")) | sub("plan:";"")')
if [ -n "$PLAN_SLUG" ] && [ -f "docs/plans/$PLAN_SLUG.md" ]; then
    cat "docs/plans/$PLAN_SLUG.md"
fi
```

**3. Read all rules that apply:**
```bash
ls docs/rules/*.md 2>/dev/null | xargs -I {} sh -c 'echo "--- {} ---"; cat {}'
```

**4. Extract acceptance criteria** from the bead notes. Write them
into the root bead notes as the explicit "exit contract" so you can
verify them at self-test time.

**Exit criteria:** You can name every acceptance criterion and every
rule that applies.
"""

[[steps]]
id = "actual-adr-check"
title = "Verify ADRs are in sync with generated rules"
needs = ["intake"]
description = """
Use the `actual` skill to check that `CLAUDE.md` / `AGENTS.md` are
not stale relative to the rig's ADRs. If they are, hand the work
back to the architect rather than coding against stale rules.

**1. Run `actual status` from the rig root** (not the work dir):
```bash
if ! command -v actual >/dev/null 2>&1; then
    # Skip the check; log the skip in the bead notes.
    bd update $ROOT_ID --notes "<existing notes>
adr_check: skipped — actual CLI not installed"
    exit 0
fi

# actual must run from the rig root where CLAUDE.md and .actual/ live
cd "$RIG_ROOT"   # Set from the Rig root shown in your prompt footer
status_output=$(actual status --verbose 2>&1 || true)
echo "$status_output"
```

**2. Decide: in-sync or drifted?**
- Output contains "in sync" or "up to date" → proceed.
- Output contains "out of date", "drift", or "diverged" → hand back.

**3a. In sync:**
```bash
bd update $ROOT_ID --notes "<existing notes>
adr_check: ok"
```

**3b. Drifted — hand back to architect:**
```bash
ARCH_ID=$(bd create \\
    --title "Resync ADRs before building $ROOT_ID" \\
    --label needs-architecture \\
    --label blocks:$ROOT_ID \\
    --notes "Builder stopped: actual status reported drift.

Drift report:
$status_output

Originating bead: $ROOT_ID" \\
    --json | jq -r '.id')
bd dep add $ROOT_ID --blocked-by $ARCH_ID
# The needs-architecture label triggers architect-guardrail-check order automatically.
# Do NOT gc mail send — it creates duplicate sessions.
exit 0
```

**Exit criteria:** Either ADRs are in sync or a hand-back bead is
filed and the formula pauses.
"""

[[steps]]
id = "plan"
title = "Write a short implementation plan in the bead notes"
needs = ["actual-adr-check"]
description = """
Two or three bullets. Not an essay. No speculative abstractions.

```bash
bd update $ROOT_ID --notes "<existing notes>
impl_plan:
- <first change>
- <second change>
- <third change, if any>"
```

**Rules:**
- Only propose changes that move the bead toward its acceptance
  criteria.
- Reuse existing helpers; do not introduce new abstractions for
  one-time use.
- Prefer editing existing files over creating new ones.

**Exit criteria:** 2-3 implementation bullets in the bead notes.
"""

[[steps]]
id = "implement"
title = "Make the code changes"
needs = ["plan"]
description = """
Execute the plan from the previous step.

**Guardrails:**
- Follow existing code patterns. Check neighbouring files for style,
  naming, and library choices before adding anything new.
- Never add dependencies without an explicit note in the bead.
- Never modify files outside the scope implied by the plan.
- Do not write documentation files unless the rule set requires them.
- Do not commit yet — the commit happens in the handoff step after
  tests pass.

**Exit criteria:** The worktree contains the changes from your plan.
"""

[[steps]]
id = "self-test"
title = "Run the validator's test suite"
needs = ["implement"]
description = """
Run the tests. Fix failures. Never hand off red tests.

**1. Determine the test command:**
```bash
TEST_CMD="{{test_cmd}}"
if [ -z "$TEST_CMD" ]; then
    # Simple auto-detection by rig type.
    if [ -f go.mod ]; then TEST_CMD="go test ./..."
    elif [ -f package.json ]; then TEST_CMD="npm test --silent"
    elif [ -f Cargo.toml ]; then TEST_CMD="cargo test"
    elif [ -f pyproject.toml ] || [ -f setup.py ]; then TEST_CMD="pytest -q"
    else TEST_CMD="echo 'no test runner detected'; exit 1"
    fi
fi
echo "Running: $TEST_CMD"
```

**2. Run:**
```bash
if $TEST_CMD 2>&1 | tee /tmp/actual-builder-test.log; then
    bd update $ROOT_ID --notes "<existing notes>
self_test: pass
test_cmd: $TEST_CMD"
else
    TAIL=$(tail -30 /tmp/actual-builder-test.log)
    bd update $ROOT_ID --notes "<existing notes>
self_test: FAIL
test_cmd: $TEST_CMD
failure_tail: |
$TAIL"
    # STOP. Go back to implement, fix the failures, re-run this step.
    # Do not proceed to handoff with red tests.
    exit 1
fi
```

**Exit criteria:** Tests green. `self_test: pass` recorded.
"""

[[steps]]
id = "handoff"
title = "Commit and hand off to the reviewer"
needs = ["self-test"]
description = """
**1. Sanity-check the diff:**
```bash
git status
git diff --stat
```

**2. Stage only the files implied by the plan.** Do NOT blanket-stage:
```bash
git add <explicit paths from impl_plan>
```

**3. Commit with a conventional message:**
```bash
BEAD_TITLE=$(bd show $ROOT_ID --json | jq -r '.title')
git commit -m "{{commit_scope}}: $BEAD_TITLE (refs $ROOT_ID)"
```

**4. Label the bead for the reviewer:**
```bash
bd update $ROOT_ID --add-label needs-review --remove-label ready-to-build
```

**5. Close the bead** so downstream dependencies unblock:
```bash
bd close $ROOT_ID --comment "Build complete. Handed off to reviewer."
```

**6. Do NOT use `gc mail send` to notify downstream agents.**
The `needs-review` label triggers the reviewer-intake order automatically.
Mail creates duplicate sessions and bypasses max_active_sessions limits.

**7. Wake downstream agents** whose beads may have just unblocked:
```bash
sh packs/actual/all/scripts/wake-downstream.sh &
```

**Exit criteria:** Commit landed, bead closed, bead labelled `needs-review`.
"""
