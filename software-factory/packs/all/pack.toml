# actual-factory — Composition pack that wires the essential 6 Agent
# Operations into a single runnable software factory: Planner,
# Architect, Designer, Coder, Reviewer, Deployer.
#
# Includes every essential leaf pack in software-factory/packs/ via
# relative paths. Each leaf pack is also usable standalone — this
# one just bundles them so a user can bring the whole factory up
# with a single `includes = ["software-factory/packs/all"]` line in
# their city.toml.
#
# The optional 7th agent — improver — is intentionally NOT included
# here. It is opt-in (introduced in W4 for continuous-improvement
# loops). To wire it into a factory, add `"../improver"` to the
# includes list below or include `software-factory/packs/improver`
# directly from your city.toml.
#
# The "pipeline" is NOT hardcoded here. Each leaf pack's order gate
# matches on a bead label (needs-architecture, needs-plan, etc.)
# and wakes on its own. The flow is emergent from labels, not
# prescribed by Go or by this file.

[pack]
name = "actual-factory"
schema = 1
includes = [
    "../architect",
    "../planner",
    "../designer",
    "../coder",
    "../reviewer",
    "../deployer",
]
