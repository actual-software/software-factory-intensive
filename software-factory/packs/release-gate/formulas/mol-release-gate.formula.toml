description = """
Release gate — 6 steps from a `ready-to-ship` bead to a tagged
release with a rollback plan.

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| version_file | caller | Path to the version file (default: VERSION) |
| smoke_cmd | caller | Command to run smoke tests (default: "") |
| deploy_cmd | caller | Command to trigger deploy (default: "") |
"""
formula = "mol-release-gate"
version = 1

[vars]
[vars.version_file]
description = "Path to the rig's version file (e.g., VERSION, package.json, Cargo.toml)"
default = "VERSION"

[vars.smoke_cmd]
description = "Command that runs smoke tests against the built artifact. Empty = skip."
default = ""

[vars.deploy_cmd]
description = "Command that triggers the actual deploy. Empty = tag-only."
default = ""

[[steps]]
id = "intake"
title = "Read the bead and confirm the reviewer passed it"
description = """
**1. Root bead:**
```bash
ROOT_ID=$(bd mol current --json | jq -r '.molecule_id')
bd show $ROOT_ID
```

**2. Check the reviewer's verdict in the notes.** Must say
`verdict: pass`. If not, STOP and mail the reviewer:
```bash
VERDICT=$(bd show $ROOT_ID --json | jq -r '.notes' | grep -m1 '^verdict:' | awk '{print $2}')
if [ "$VERDICT" != "pass" ]; then
    # The needs-review label triggers reviewer-intake order automatically.
    # Do NOT gc mail send — it creates duplicate sessions.
    bd update $ROOT_ID --add-label needs-review --remove-label ready-to-ship
    exit 0
fi
```

**Exit criteria:** Verdict confirmed as pass.
"""

[[steps]]
id = "checks"
title = "Verify CI is green and no blockers are open"
needs = ["intake"]
description = """
**1. CI status.** If the rig is on GitHub:
```bash
if command -v gh >/dev/null 2>&1; then
    gh pr checks --required 2>/dev/null || echo "(no PR bound)"
fi
```

Otherwise check whatever CI the rig uses (jenkins, buildkite, etc.)
per the rules in `docs/rules/ci.md` if one exists.

**2. Blocker beads.** Any other bead labelled `blocker` that
depends on this one MUST be closed first:
```bash
BLOCKERS=$(bd dep blockers $ROOT_ID --json 2>/dev/null | jq -r '.[] | .id')
if [ -n "$BLOCKERS" ]; then
    echo "blocked by: $BLOCKERS"
    exit 1
fi
```

**3. Record:**
```bash
bd update $ROOT_ID --notes "<existing notes>
gate_checks: pass"
```

**Exit criteria:** CI green, no blockers.
"""

[[steps]]
id = "smoke"
title = "Run smoke tests against the built artifact"
needs = ["checks"]
description = """
Smoke tests exercise the critical happy paths only. Skip entirely
if `{{smoke_cmd}}` is empty — the rig may not have a smoke target.

```bash
if [ -n "{{smoke_cmd}}" ]; then
    if ! {{smoke_cmd}}; then
        bd update $ROOT_ID --notes "<existing notes>
smoke: FAIL"
        # The ready-to-build label triggers builder-intake order automatically.
        # Do NOT gc mail send — it creates duplicate sessions.
        bd update $ROOT_ID --add-label ready-to-build --remove-label ready-to-ship
        exit 0
    fi
fi
bd update $ROOT_ID --notes "<existing notes>
smoke: pass"
```

**Exit criteria:** Smoke passed or was not configured.
"""

[[steps]]
id = "version"
title = "Decide and write the semver bump"
needs = ["smoke"]
description = """
**1. Read the current version:**
```bash
CURRENT=$(cat {{version_file}} 2>/dev/null || echo "0.0.0")
```

**2. Decide the bump from the bead:**
- Commit type `feat` → minor bump
- Commit type `fix` → patch bump
- Any bead label containing `breaking` → major bump
- Otherwise → patch bump

**3. Write the new version to the file** and stage:
```bash
NEXT="<computed version>"
echo "$NEXT" > {{version_file}}
git add {{version_file}}
bd update $ROOT_ID --notes "<existing notes>
version_before: $CURRENT
version_after: $NEXT"
```

**Exit criteria:** `{{version_file}}` updated, version recorded in
bead notes.
"""

[[steps]]
id = "tag"
title = "Commit, tag, and generate release notes"
needs = ["version"]
description = """
**1. Commit the version bump:**
```bash
NEXT=$(cat {{version_file}})
git commit -m "release: v$NEXT (refs $ROOT_ID)"
```

**2. Tag:**
```bash
git tag -a "v$NEXT" -m "Release v$NEXT

Bead: $ROOT_ID
$(bd show $ROOT_ID --json | jq -r '.title')"
```

**3. Release notes.** Append an entry to CHANGELOG.md if the rig
has one, or create `docs/releases/v$NEXT.md`:
```bash
mkdir -p docs/releases
cat > "docs/releases/v$NEXT.md" <<EOF
# v$NEXT — $(date -u +%Y-%m-%d)

## Summary
$(bd show $ROOT_ID --json | jq -r '.title')

## Details
- Bead: $ROOT_ID
- Commit: $(git rev-parse HEAD)
- Version bump: $(bd show $ROOT_ID --json | jq -r '.notes' | grep version_before || echo unknown)
EOF
git add "docs/releases/v$NEXT.md"
git commit -m "docs: release notes for v$NEXT" || true
```

**4. Trigger deploy if configured:**
```bash
if [ -n "{{deploy_cmd}}" ]; then
    {{deploy_cmd}}
fi
```

**Exit criteria:** Tag created, release notes written, deploy
triggered (or noted as tag-only).
"""

[[steps]]
id = "rollback-plan"
title = "Record a rollback plan and hand off to the improver"
needs = ["tag"]
description = """
Every approved release gets a rollback plan BEFORE anyone celebrates.

**1. Compute the rollback command:**
```bash
PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "<none>")
NEXT=$(cat {{version_file}})
ROLLBACK_CMD="git revert --no-edit v$NEXT # or: git reset --hard $PREV_TAG && git push --force-with-lease"
```

**2. Write the plan:**
```bash
bd update $ROOT_ID --notes "<existing notes>
rollback_plan: |
  Previous tag: $PREV_TAG
  Command: $ROLLBACK_CMD
  Data migrations to reverse: <list or 'none'>
  Feature flags to flip: <list or 'none'>"
```

**3. Create the improver bead:**
```bash
IMP_ID=$(bd create \\
    --title "Watch v$NEXT in production" \\
    --label needs-improve \\
    --label source:actual-release-gate \\
    --label release:v$NEXT \\
    --notes "Release $ROOT_ID just shipped v$NEXT. Watch metrics and file feedback.

Rollback command:
$ROLLBACK_CMD" \\
    --json | jq -r '.id')
bd dep add $IMP_ID --blocked-by $ROOT_ID
```

**4. Close the root bead:**
```bash
bd close $ROOT_ID --reason "shipped as v$NEXT"
# Wake downstream agents.
sh packs/actual/all/scripts/wake-downstream.sh &
```

**Exit criteria:** Rollback plan recorded; improver bead created;
root bead closed.
"""
