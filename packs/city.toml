# Software Factory — runnable sample city for the Gas City agent packs.
#
# This is a reference `city.toml` showing how to wire all 8 shipped
# packs into a single workspace. For the curriculum, participants use
# `../my-factory/city.toml` instead and include packs incrementally as
# they progress through the labs.
#
# To use this file as-is (outside the curriculum):
#   cp packs/city.toml /path/to/your-workspace/city.toml
#   cd /path/to/your-workspace
#   gc rig add /path/to/your-project
#   gc start

[workspace]
name = "software-factory-sample"
provider = "claude"
includes = ["./all"]

[daemon]
patrol_interval = "30s"
max_restarts = 5
restart_window = "1h"
shutdown_timeout = "5s"

