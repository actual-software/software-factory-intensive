# actual-architect — Architect agent pack for the Actual Software Factory.
#
# One of eight "Agent Operation" packs in examples/actual/ that map the
# operations described at https://www.actual.ai/softwarefactory onto
# self-contained Gas City custom agents.
#
# This pack ships the `actual` CLI companion skill (vendored from
# actual-software/actual-skill) so the architect has inline knowledge of
# actual adr-bot for driving ADR → CLAUDE.md/AGENTS.md synthesis.
#
# Persona anchor: principal-engineer + solutions-architect from
# actual-factory/extensions/factory-vscode/shared/actual-agents/built-in-agents.ts

[pack]
name = "actual-architect"
schema = 1

[[doctor]]
name = "check-architect"
script = "doctor/check-architect.sh"
description = "Verify architect prerequisites (bd, gc, git, actual)"

[[commands]]
name = "status"
description = "Show architect work status for the current rig"
script = "commands/status.sh"

[[commands]]
name = "rules"
description = "List architectural rules discovered under docs/rules/"
script = "commands/rules.sh"

[formulas]
dir = "formulas"

# ── ARCHITECT — Principal-Engineer voice. Rig-scoped singleton. ──────
[[agent]]
name = "architect"
scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/agents/{{.Rig}}/architect"
prompt_template = "prompts/architect.md.tmpl"
nudge = "Run 'gc prime', then check bd ready --label=needs-architecture for work."
overlay_dir = "overlays/default"
idle_timeout = "2h"
min_active_sessions = 0
max_active_sessions = 1
