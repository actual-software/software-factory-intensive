description = """
Release-delivery factory graph.

Turns one feature request into planning, architecture, design, an implemented
project change, validation, review, and a release gate. The graph owns the
order of work.
"""
formula = "mol-release-delivery"
version = 2
contract = "graph.v2"

[[steps]]
id = "plan"
title = "Write the feature plan"
description = "Planner reads the request and project context, then writes docs/plans/<slug>.md."
metadata = { "gc.run_target" = "factory.planner", artifact_path = "docs/plans/<slug>.md" }

[[steps]]
id = "architecture"
title = "Write the architecture decision"
description = "Architect reads the plan and project context, then writes docs/architecture/<slug>.md."
needs = ["plan"]
metadata = { "gc.run_target" = "factory.architect", artifact_path = "docs/architecture/<slug>.md" }

[[steps]]
id = "design"
title = "Write the implementation design"
description = "Designer reads the plan and architecture, then writes docs/designs/<slug>.md."
needs = ["architecture"]
metadata = { "gc.run_target" = "factory.designer", artifact_path = "docs/designs/<slug>.md" }

[[steps]]
id = "build"
title = "Implement and test the change"
description = "Builder reads the upstream artifacts, updates project code and tests, runs the test suite, and commits the result."
needs = ["design"]
metadata = { "gc.run_target" = "factory.builder", artifact = "implementation commit" }

[[steps]]
id = "validate"
title = "Validate the implementation"
description = "Validator reruns tests and writes docs/validation/<slug>.md with the test evidence."
needs = ["build"]
metadata = { "gc.run_target" = "factory.validator", artifact = "test report" }

[[steps]]
id = "review"
title = "Review the implementation"
description = "Reviewer inspects the artifacts, diff, and test results, then writes docs/reviews/<slug>.md."
needs = ["validate"]
metadata = { "gc.run_target" = "factory.reviewer", artifact_path = "docs/reviews/<slug>.md" }

[[steps]]
id = "release"
title = "Write the release gate"
description = "Release gate evaluates evidence and writes docs/releases/<slug>.md with a PASS or FAIL verdict."
needs = ["review"]
metadata = { "gc.run_target" = "factory.release-gate", artifact_path = "docs/releases/<slug>.md" }
