# Actual Software Factory — runnable sample city.
#
# Brings up the 8 Agent Operation packs from examples/actual/ as a
# self-contained Gas City workspace. Maps to the Actual AI software
# factory: https://www.actual.ai/softwarefactory
#
# To use:
#   gc rig add /path/to/your/project
#   gc start examples/actual/
#
# Each operation is a rig-scoped agent — the factory only comes to
# life once you have at least one rig registered.

[workspace]
name = "20260415-gc-factory-v1"
provider = "claude"
start_command = "<user_home>/.nvm/versions/node/v22.19.0/bin/claude"
includes = ["packs/actual/all"]

[daemon]
patrol_interval = "30s"
max_restarts = 5
restart_window = "1h"
shutdown_timeout = "5s"

